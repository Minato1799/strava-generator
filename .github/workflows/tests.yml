name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: Lint Python
        run: ruff check .

      - name: Run Django checks and tests with coverage
        env:
          CONTEXT: DEBUG
        run: |
          python manage.py check
          coverage run --branch --source=mylibs,strava,strava_generator manage.py test tests
          coverage report --skip-covered --fail-under=80

      - name: Check Vercel deployment settings
        env:
          DJANGO_SECRET_KEY: ci-deploy-check-only-f7a9c2e4b6d8f1a3c5e7b9d2f4a6c8e0
          VERCEL: "1"
          VERCEL_BRANCH_URL: ci-preview.example.vercel.app
          VERCEL_PROJECT_PRODUCTION_URL: ci-production.example.vercel.app
          VERCEL_URL: ci-deployment.example.vercel.app
        run: python manage.py check --deploy --fail-level WARNING

      - name: Check JavaScript syntax
        run: node --check strava_generator/static/strava_generator/js/index.js

      - name: Audit Python dependencies
        run: pip-audit --require-hashes -r requirements.txt
